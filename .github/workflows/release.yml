name: Release

on:
  release:
    types: [created]

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    container: arm64v8/golang:1.17-bullseye
    strategy:
      matrix:
        # build and publish in parallel: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64
        goos: [linux]
        goarch: [arm64]
    steps:
      - uses: actions/checkout@v2
      - run: cd cmd/geth && GOOS=linux GOARCH=arm64 go build
