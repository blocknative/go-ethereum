name: Release

on:
  release:
    types: [created]

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64
        goos: [linux]
        goarch: [arm64]
    steps:
      - uses: actions/checkout@v2
      - run: docker build --platform linux/arm64 -t go-release-action-arm64 .
      - uses: blocknative/go-release-action-arm64@v1.28-arm64.0
        with:
          pre_command: export DOCKER_DEFAULT_PLATFORM=linux/arm64
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          binary_name: geth
          project_path: ./cmd/geth
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
